name: Veille inscriptions MIUT

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Persist state
        continue-on-error: true
        run: |
          git config user.name "miut-bot"
          git config user.email "miut-bot@users.noreply.github.com"
          if [ ! -f state.json ]; then
            echo "state.json absent - rien a committer"
            exit 0
          fi
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json inchange"
            exit 0
          fi
          git commit -m "state $(date -u +%F_%H:%M)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
